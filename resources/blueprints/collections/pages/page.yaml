title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: content
            field:
              type: markdown
              display: Content
              localizable: true
              escape_markup: true
          -
            handle: author
            field:
              type: users
              display: Author
              default: current
              localizable: true
              max_items: 1
          -
            handle: template
            field:
              type: template
              display: Template
              localizable: true
          -
            handle: pagina_subtitel
            field:
              type: text
              display: 'Pagina Subtitel'
          -
            handle: pagina_titel
            field:
              type: list
              display: 'Pagina Titel'
      -
        display: SEO
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: 'Title (OUD)'
          -
            handle: seo_title
            field:
              type: text
              display: Titel
          -
            handle: seo_description
            field:
              type: textarea
              display: Beschrijving
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
